name: Orbit Browser CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-build-and-test:
    name: Gradle Test, Lint & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Optional job when building native Brave adblock-rust (.so) via cargo-ndk
  rust-adblock-check:
    name: Check Native adblock-rust Crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: hashFiles('native/adblock-rust/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check
        if: hashFiles('native/adblock-rust/Cargo.toml') != ''
        working-directory: native/adblock-rust
        run: cargo check --locked || cargo check
