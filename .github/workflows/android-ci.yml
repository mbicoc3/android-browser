name: Orbit Browser CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-build-and-test:
    name: Gradle Test, Lint & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Run Android Lint
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:lintDebug --no-daemon
          else
            gradle :app:lintDebug --no-daemon
          fi

      - name: Build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-browser-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # Optional job when building native Brave adblock-rust (.so) via cargo-ndk
  rust-adblock-check:
    name: Check Native adblock-rust Crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: hashFiles('native/adblock-rust/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check
        if: hashFiles('native/adblock-rust/Cargo.toml') != ''
        working-directory: native/adblock-rust
        run: cargo check
